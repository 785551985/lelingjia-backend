name: 部署后端 Java API (api.ylglxt.cn)

on:
  workflow_dispatch: # 仅在 GitHub 网页端手动点击 "Run workflow" 按钮时触发部署

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 设置 JDK 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 3. 编译 Java 后端应用
        run: |
          mvn clean package -DskipTests

      - name: 4. 上传 jar 包到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: 'ruoyi-admin/target/ruoyi-admin.jar'
          target: '/www/wwwroot/backend/'
          strip_components: 2

      - name: 5. 远程自动同步 SQL 增量并平滑重启 Java 服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. 自动扫描并执行数据库增量 SQL 脚本（兼容所有常见 SQL 目录）
            for update_dir in \
                "/www/wwwroot/dazhao_kb_src/lelingjia-backend/sql/update" \
                "/www/wwwroot/dazhao_kb_src/lelingjia-backend/script/sql" \
                "/www/wwwroot/dazhao_kb_src/lelingjia-backend/docs/script/sql/update"; do
                if [ -d "$update_dir" ]; then
                    for sql_file in $(ls ${update_dir}/*.sql 2>/dev/null | sort); do
                        if [ -f "$sql_file" ]; then
                            echo "   执行增量 SQL: $(basename $sql_file)..."
                            PGPASSWORD="dz123456" psql -h 127.0.0.1 -p 5372 -U dazhao_kb -d dazhao_kb -f "$sql_file" || true
                        fi
                    done
                fi
            done

            # 2. 平滑重启 Java 服务
            PID=$(ps -ef | grep ruoyi-admin.jar | grep -v grep | awk '{print $2}')
            if [ -n "$PID" ]; then
                echo "停止旧进程 PID: $PID"
                kill -9 $PID || true
                sleep 2
            fi
            nohup java -jar /www/wwwroot/backend/ruoyi-admin.jar \
              --spring.profiles.active=prod \
              --spring.datasource.dynamic.datasource.master.url="jdbc:postgresql://127.0.0.1:5372/dazhao_kb?currentSchema=public&stringtype=unspecified" \
              --spring.datasource.dynamic.datasource.master.driverClassName="org.postgresql.Driver" \
              --spring.datasource.dynamic.datasource.master.username="dazhao_kb" \
              --spring.datasource.dynamic.datasource.password="dz123456" \
              > /www/wwwroot/backend/ruoyi.log 2>&1 &
            echo "✅ 后端 SQL 增量同步与 Java 服务平滑重启完成！"
